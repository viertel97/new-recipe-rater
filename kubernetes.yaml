apiVersion: v1
kind: Pod
metadata:
  name: new-recipe-rater-forward
  namespace: new-recipe-rater
  labels:
    app: new-recipe-rater
spec:
  containers:
    - name: forward
      image: alpine/socat
      command:
        - socat
        - TCP-LISTEN:3000,fork,reuseaddr
        - TCP:192.168.178.110:3000
      ports:
        - containerPort: 3000
---
# 2) Service pointing to the forwarding pod
apiVersion: v1
kind: Service
metadata:
  name: new-recipe-rater-service
  namespace: new-recipe-rater
spec:
  selector:
    app: new-recipe-rater
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
---
# 3) Ingress exposing the service externally with TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: new-recipe-rater-ingress
  namespace: new-recipe-rater
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - new-recipe-rater.viertel-it.de
      secretName: tls.new-recipe-rater
  rules:
    - host: new-recipe-rater.viertel-it.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: new-recipe-rater-service
                port:
                  number: 80